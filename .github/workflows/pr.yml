name: PR

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Pruebas
        run: pytest

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Seguridad en el pull request (no al final del deploy)
        run: |
          echo "Este job es una puerta del PR. Si falla, no hay merge ni deploy."
          python -m pip install bandit
          bandit -r src -ll
